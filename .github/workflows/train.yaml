name: CI & Pipeline Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: "dummy-test-key-for-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and install package with dev tools
        run: |
          python -m pip install --upgrade pip
          pip install "packaging>=23.2,<24.0"
          pip install -e ".[dev]"

      - name: Run Data Quality Checks
        run: |
          python -m src.data.dq_check --input ./data

      - name: Ingest Data Pipeline into DuckDB
        run: |
          python -m src.data.pipeline --input ./data

      - name: Train and Evaluate ML Model
        run: |
          python -m src.ml.train

      - name: Lint, Format, and Test Suite with Coverage (>80%)
        run: |
          pykit check

      - name: Verify Package Wheel Build
        run: |
          pykit build

      - name: Verify Docker Container Build
        run: |
          docker compose build