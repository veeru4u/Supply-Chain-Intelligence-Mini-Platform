services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-chain-api
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=supply_chain.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s